<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    /* this is for the transparent header */
    
    /* tuck the video hero up under the top menue */
    .page-banner { top: -71px; }

    /* set it to transparent to start */
    #masthead,
    .middle-nav {
        background: transparent;
        transition: background-color 0.5s ease;
    }
    .campaign-nav a.active { border-bottom: 3px solid transparent; }
    .campaign-nav a { color: white; }
    #masthead.fgcu-header-scrolled { background: white; }

    /* set it back to normal if scrolled */
    .fgcu-header-scrolled .campaign-nav a { color: #333 !important; }
    .fgcu-header-scrolled #masthead.scrolled { background: white; }
    .fgcu-header-scrolled .campaign-nav a.active { border-bottom: 3px solid #00794c; }

</style>

<script>
    // this is for the transparent header
    window.addEventListener('scroll', () => {
        const body = document.body;
        const headerBar = document.getElementById('masthead');
        if (window.scrollY > 100) {
            headerBar.classList.add('fgcu-header-scrolled');
        } else {
            headerBar.classList.remove('fgcu-header-scrolled');
        }
    });
</script>


</head>

<body>








</body>

</html>
